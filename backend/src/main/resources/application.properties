spring.application.name=order-inventory-integration

# --- Supabase (Postgres) connection ---
# Never hardcode these. Set them as real environment variables before running
# the app (see README "Supabase setup" section).
spring.datasource.url=${SUPABASE_DB_URL}
spring.datasource.username=${SUPABASE_DB_USERNAME}
spring.datasource.password=${SUPABASE_DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Tables are created by sql/schema.sql, not by Hibernate - "validate" makes
# Spring check the entities match the DB schema on startup instead of
# silently altering your Supabase tables.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

server.port=${SERVER_PORT:8080}

# React dev server origin, overridable per environment.
cors.allowed-origin=${CORS_ALLOWED_ORIGIN:http://localhost:5173}
