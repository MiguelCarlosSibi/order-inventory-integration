spring.application.name=order-inventory-integration

# --- Supabase (Postgres) connection ---
# Never hardcode these. Set them as real environment variables before running
# the app (see README "Supabase setup" section).
spring.datasource.url=${SUPABASE_DB_URL}
spring.datasource.username=${SUPABASE_DB_USERNAME}
spring.datasource.password=${SUPABASE_DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Tables are created by sql/schema.sql, not by Hibernate - "validate" makes
# Spring check the entities match the DB schema on startup instead of
# silently altering your Supabase tables.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.task.scheduling.pool.size=12
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

server.port=${SERVER_PORT:8080}

# React dev server origin, overridable per environment.
cors.allowed-origin=${CORS_ALLOWED_ORIGIN:http://localhost:5173}

# --- LegacySupply (external supplier) ---
# ClientId is your student id; ApiKey is provided privately by the
# instructor. Never hardcode the key or commit it - set LS_API_KEY as a
# real environment variable before running the app.
legacysupply.base-url=${LS_BASE_URL:https://legacysupply.onrender.com/api/v1}
legacysupply.client-id=${LS_CLIENT_ID}
legacysupply.api-key=${LS_API_KEY}

# How far below threshold triggers a reorder request, and how often the
# scheduled jobs run (milliseconds).
supplier.reorder.pending-retry-interval-ms=${SUPPLIER_PENDING_RETRY_MS:60000}
supplier.reorder.delivery-poll-interval-ms=${SUPPLIER_DELIVERY_POLL_MS:5000}

# --- Tiangge (Lab 4 marketplace channel) ---
# Same student id and API key as LegacySupply - the manual says to reuse
# them. TG_BASE_URL defaults to the documented path; override if Postman
# testing (Stage 0) shows a different actual base address.
tiangge.base-url=${TG_BASE_URL:https://legacysupply.onrender.com/tiangge/v1}
tiangge.client-id=${LS_CLIENT_ID}
tiangge.api-key=${LS_API_KEY}
tiangge.app-name=${TG_APP_NAME:order-inventory-integration}
